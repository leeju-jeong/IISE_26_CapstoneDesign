data:
  fps: 30
  frame_step: 3
  window_sec: 10
  stride_sec: 5
  joints: [0, 2, 5, 7, 8, 11, 12, 13, 14, 15, 16]
  joint_dim: 7
  min_confidence: 0.5

model:
  feature_dim: 512
  clip_dim: 512
  clip_model: "ViT-B-32"
  clip_pretrained: "openai"
  adapter_hidden: 512
  freeze_backbone: true
  n_frames: 100
  n_joints: 11
  motionbert_ckpt: "models/motionbert/MB_release.bin"

training:
  device: "cuda"
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.00001
  epochs: 5
  temperature: 0.07
  checkpoint_dir: "checkpoints/dummy"
  normal_prompts:
    - "A student is sitting upright and focusing on studying."
    - "A learner is looking at the screen or desk material with sustained attention."
    - "A student is engaged in a normal self-study session."
    - "A person is reading or writing at a desk in a focused manner."

inference:
  mahal_gamma: 1.0
  smooth_window_sec: 10
  smooth_stride_sec: 5
