# 10s / 5s / 10fps 비교 설정 → clip (100, 11, 7)
data:
  fps: 30
  sampled_fps: 10
  window_sec: 10
  stride_sec: 5
  joints: [0, 2, 5, 7, 8, 11, 12, 13, 14, 15, 16]
  n_joints: 11
  joint_dim: 7
  min_confidence: 0.3
  conf_threshold: 0.5
  boundary_margin_sec: 5

model:
  feature_dim: 512
  clip_dim: 512
  clip_model: "ViT-B-32"
  clip_pretrained: "openai"
  adapter_hidden: 512
  adapter_dropout: 0.1
  freeze_backbone: true
  n_frames: 100
  n_joints: 11
  n_joints_h36m: 17
  motionbert_ckpt: "models/motionbert/lite_bert.bin"
  motionbert_maxlen: 243
  motionbert_dim_feat: 256
  motionbert_mlp_ratio: 4
  motionbert_depth: 5
  motionbert_num_heads: 8
  pooling: "mean"

training:
  device: "cuda"
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00001
  epochs: 50
  preserve_weight: 0.1
  checkpoint_dir: "checkpoints_10s"
  normal_prompts:
    - "a student is studying"
    - "a student is reading a book"
    - "a student is writing notes"
    - "a student is solving problems at a desk"
    - "a student is looking at a laptop for studying"
  ood_prompts: []
  ood_loss_weight: 0.0

inference:
  fusion: "linear_40_40_20"
  gamma_x: 1.0
  gamma_z: 1.0
  stats_eps: 1.0e-8
  smooth_clips: 3
